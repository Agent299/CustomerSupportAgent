name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:  # integration tests (tests/conftest.py) fail, not skip, in CI
        image: postgres:18.6
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
          POSTGRES_DB: support
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U support -d support"
          --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:9.1.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      opensearch:
        image: opensearchproject/opensearch:3.9.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # Service containers can't take a start command, so Redpanda runs via docker run.
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda -p 19092:19092 \
            docker.redpanda.com/redpandadata/redpanda:v26.2.5 \
            redpanda start --mode=dev-container --smp=1 --memory=1G \
            --kafka-addr=PLAINTEXT://0.0.0.0:19092 \
            --advertise-kafka-addr=PLAINTEXT://localhost:19092
          for i in $(seq 1 30); do
            docker exec redpanda rpk cluster health 2>/dev/null | grep -qE 'Healthy:.+true' && exit 0
            sleep 2
          done
          docker logs redpanda; exit 1
      - uses: astral-sh/setup-uv@v10.3.0  # astral publishes exact tags only, no moving v10
        with:
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock  # relative to working-directory
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
        env:
          APP_ENV: ci
          TEST_ADMIN_DSN: postgresql://support:support@localhost:5432/support
          TEST_OPENSEARCH_URL: http://localhost:9200
          TEST_KAFKA_SERVERS: localhost:19092
          TEST_VALKEY_URL: redis://localhost:6379/15

  web:
    name: Web (lint, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json   # pnpm version comes from "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  docker:
    name: Images build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target api -t support-agent/api backend
      - run: docker build --target worker -t support-agent/worker backend

  # Single, stable check name for the main-branch ruleset to require.
  # Add new jobs to `needs` and they automatically become merge requirements.
  ci-passed:
    name: CI passed
    if: always()
    needs: [backend, web, docker]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A required CI job did not succeed ($r)"
              exit 1
            fi
          done
