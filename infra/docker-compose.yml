# Local development stack. Production: deploy/oracle/docker-compose.prod.yml (docs/DEPLOY.md).
#   make up        → datastores only (run the API on the host with `make api`)
#   make up-app    → datastores + containerized API
name: support-agent

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
      POSTGRES_DB: support
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9.1.2-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.5
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    volumes: [redpanda:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"       # never published outside the Docker network
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports: ["9200:9200"]
    volumes: [opensearch:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  neo4j:
    image: neo4j:2026.09.0-community
    environment:
      NEO4J_AUTH: neo4j/localdevpassword
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j:/data]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p localdevpassword 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30

  api:
    profiles: [app]
    build: ../backend
    env_file: [../.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://support:support@postgres:5432/support
      REDIS_URL: redis://valkey:6379/0
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      OPENSEARCH_URL: http://opensearch:9200
      NEO4J_URI: bolt://neo4j:7687
      INGEST_WEBHOOK_TOKEN: ${INGEST_WEBHOOK_TOKEN:-}  # set in your shell to enable the webhook
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      neo4j: { condition: service_healthy }

volumes:
  pgdata:
  redpanda:
  opensearch:
  neo4j:
