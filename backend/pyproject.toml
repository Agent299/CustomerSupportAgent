[project]
name = "support-agent"
version = "0.1.0"
description = "GraphRAG customer support agent for MongoDB docs (core API + ingestion workers)"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20",
    "asyncpg>=0.32",
    "defusedxml>=0.7.1",
    "fastapi>=0.143",
    "httpx>=0.28",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1.5",
    "structlog>=26.1",
    "tiktoken>=0.14",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.0",
    "ruff>=0.17",
    "types-defusedxml>=0.7.0.20260504",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs a running Postgres (make up); always runs in CI"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]       # long literal fixtures
"migrations/*" = ["E501"]  # autogenerated

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["app", "workers", "shared"]
