[project]
name = "support-agent"
version = "0.1.0"
description = "GraphRAG customer support agent for MongoDB docs (core API + ingestion workers)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143",
    "pydantic-settings>=2.16",
    "structlog>=26.1",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.4",
    "pytest>=9.1",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["app", "workers", "shared"]
